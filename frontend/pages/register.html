<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account to shop the latest products and track your orders.">
    <title>Sign Up - E-Commerce Store</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

    <main class="auth-wrapper">
        <!-- Category Tag -->
        <span class="auth-tag">SIGN UP</span>

        <!-- Headings -->
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Enter your details to get started</p>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="auth-alert" role="alert"></div>

        <!-- Sign Up Form -->
        <form id="registerForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="usernameInput" class="form-label">Username</label>
                <input 
                    type="text" 
                    id="usernameInput" 
                    class="form-input" 
                    placeholder="username" 
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="emailInput" class="form-label">Email</label>
                <input 
                    type="email" 
                    id="emailInput" 
                    class="form-input" 
                    placeholder="email@example.com" 
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="passwordInput" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    class="form-input" 
                    placeholder="••••••••" 
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" id="registerBtn" class="btn-auth-primary">Sign Up</button>
        </form>

        <!-- Footer Link to Login -->
        <p class="auth-footer">
            Already have an account? <a href="login.html">Log in</a>
        </p>

        <!-- Back to Store Link -->
        <a href="../index.html" class="back-to-store">← Back to Store</a>
    </main>

    <!-- Scripts -->
    <script src="../js/auth.js?v=4"></script>
    <script src="../js/register.js?v=4"></script>
</body>
</html>
