<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your account to shop products and manage your profile.">
    <title>Login - E-Commerce Store</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

    <main class="auth-wrapper">
        <!-- Category Tag -->
        <span class="auth-tag">LOGIN</span>

        <!-- Headings -->
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="auth-alert" role="alert"></div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="emailInput" class="form-label">Email</label>
                <input 
                    type="email" 
                    id="emailInput" 
                    class="form-input" 
                    placeholder="email@example.com" 
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="passwordInput" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    class="form-input" 
                    placeholder="••••••••" 
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="forgot-password-wrap">
                <a href="#" id="forgotPasswordLink" class="auth-link-forgot">Forgot password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn-auth-primary">Sign In</button>
        </form>

        <!-- Footer Link to Sign Up -->
        <p class="auth-footer">
            Don't have an account? <a href="register.html">Sign up</a>
        </p>

        <!-- Back to Store Link -->
        <a href="../index.html" class="back-to-store">← Back to Store</a>
    </main>

    <!-- Scripts -->
    <script src="../js/auth.js?v=4"></script>
    <script src="../js/login.js?v=4"></script>
</body>
</html>
